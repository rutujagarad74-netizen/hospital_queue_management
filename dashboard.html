
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - HealthCare+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">HealthCare+ Dashboard</a>
        <a href="index.html" class="btn btn-light">Home</a>
    </div>
</nav>

<div class="container my-5">
    <h2 class="mb-4">Dashboard</h2>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card service-card">
                <div class="card-body">
                    <h5>Total Appointments</h5>
                    <h2 class="text-primary">--</h2>
                    <p>Connect the database to display the total.</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card service-card">
                <div class="card-body">
                    <h5>Doctors Available</h5>
                    <h2 class="text-success">--</h2>
                    <p>Doctor details will be loaded from the database.</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card service-card">
                <div class="card-body">
                    <h5>Current Queue</h5>
                    <h2 class="text-warning">--</h2>
                    <p>Live queue information will be displayed here.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="appointment.html" class="btn btn-primary">Book Appointment</a>
        <a href="queue.html" class="btn btn-success">Check Queue</a>
    </div>
</div>

</body>
</html>
