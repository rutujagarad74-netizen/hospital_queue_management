
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HealthCare+</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #dff6f5, #e8f0ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .brand {
            color: #087f8c;
            font-weight: bold;
        }

        .btn-login {
            background: #087f8c;
            color: white;
        }

        .btn-login:hover {
            background: #06636d;
            color: white;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2 class="text-center brand">HealthCare+</h2>
    <p class="text-center text-muted">Hospital Appointment System</p>

    <h4 class="text-center mb-4">Patient Login</h4>

    <div id="message" class="alert d-none"></div>

    <form action="Backend/login.php" method="POST">

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control"
                   placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control"
                   placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-login w-100">
            Login
        </button>
    </form>

    <p class="text-center mt-3">
        Don't have an account?
        <a href="register.html">Register here</a>
    </p>

    <div class="text-center">
        <a href="index.html">Back to Home</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const message = document.getElementById("message");

    if (params.get("status") === "registered") {
        message.textContent = "Registration Successful! Please Login.";
        message.className = "alert alert-success";
    } else if (params.get("status") === "success") {
        message.textContent = "Login Successful! Welcome to HealthCare+.";
        message.className = "alert alert-success";
    } else if (params.get("status") === "error") {
        message.textContent = "Invalid Email or Password. Please Try Again.";
        message.className = "alert alert-danger";
    }
</script>

</body>
</html>
