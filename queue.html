<!-- Queue Status JavaScript -->
<script>

document.getElementById("queueForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const tokenInput = document.getElementById("token");
    const token = tokenInput.value.trim();

    const result = document.getElementById("queueResult");
    const button = document.getElementById("checkButton");
    const backButton = document.getElementById("backButton");

    if (!token || !Number.isSafeInteger(Number(token)) || Number(token) < 1) {

        result.innerHTML = `
            <div class="alert alert-danger">
                Please enter a valid token number.
            </div>
        `;

        return;
    }

    button.disabled = true;

    backButton.style.display = "block";

    button.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Checking...
    `;

    result.innerHTML = `
        <div class="alert alert-info">
            <i class="bi bi-hourglass-split"></i>
            Checking your queue status...
        </div>
    `;

    const formData = new FormData();
    formData.append("token", token);

    fetch("Backend/check_queue.php", {
        method: "POST",
        body: formData
    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        return response.json();

    })

    .then(data => {

        result.innerHTML = "";

        if (data.success &&
            Array.isArray(data.records) &&
            data.records.length > 0) {

            data.records.forEach(record => {

                const card = document.createElement("div");
                card.className = "result-card";

                const status = String(record.queue_status || "Unknown");

                const statusBadge =
                    status.toLowerCase() === "waiting"
                    ? "bg-warning text-dark"
                    : status.toLowerCase() === "completed"
                    ? "bg-success"
                    : "bg-primary";

                const details = [
                    ["Token Number", record.token_number],
                    ["Patient Name", record.patient_name],
                    ["Doctor", record.doctor_name],
                    ["Department", record.department],
                    ["Appointment Date", record.appointment_date],
                    ["Appointment Time", record.appointment_time]
                ];

                const heading = document.createElement("h5");
                heading.className = "text-success fw-bold mb-3";
                heading.textContent = "Queue Details Found!";

                card.appendChild(heading);

                details.forEach(([label, value]) => {

                    const row = document.createElement("div");
                    row.className = "detail-row";

                    const labelElement = document.createElement("span");
                    labelElement.className = "detail-label";
                    labelElement.textContent = label;

                    const valueElement = document.createElement("span");
                    valueElement.className = "detail-value";
                    valueElement.textContent = value ?? "Not available";

                    row.appendChild(labelElement);
                    row.appendChild(valueElement);

                    card.appendChild(row);

                });

                const statusRow = document.createElement("div");
                statusRow.className = "detail-row";

                const statusLabel = document.createElement("span");
                statusLabel.className = "detail-label";
                statusLabel.textContent = "Queue Status";

                const statusValue = document.createElement("span");
                statusValue.className = "badge " + statusBadge;
                statusValue.textContent = status;

                statusRow.appendChild(statusLabel);
                statusRow.appendChild(statusValue);

                card.appendChild(statusRow);

                result.appendChild(card);

            });

        } else {

            const alertBox = document.createElement("div");
            alertBox.className = "alert alert-danger";

            alertBox.textContent =
                data.message || "No queue details found for this token number.";

            result.appendChild(alertBox);

        }

    })

    .catch(error => {

        console.error("Queue error:", error);

        result.innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i>
                Unable to connect to the server.
                Please check your PHP server and database connection.
            </div>
        `;

    })

    .finally(() => {

        button.disabled = false;

        button.innerHTML = `
            <i class="bi bi-search"></i>
            Check Queue Status
        `;

    });

});


// Back Button Function
function clearQueueResult() {

    document.getElementById("queueResult").innerHTML = "";

    document.getElementById("backButton").style.display = "none";

    document.getElementById("token").value = "";

    document.getElementById("token").focus();

}

</script>
